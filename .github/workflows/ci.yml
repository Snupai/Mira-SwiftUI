name: CI

# PR-validation workflow. Separate from release.yml so we never block releases on
# lint warnings, and never run notarization on PRs.

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    # Skip when the release pipeline will run (commit triggers a release).
    # Release commits typically tag and the release workflow handles them.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Test
        # Tests are added in Phase 4 of the remediation plan. Until then this
        # step is a no-op so the workflow stays green.
        run: |
          if grep -q "testTarget" Package.swift; then
            swift test
          else
            echo "No test target declared yet — skipping."
          fi

  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null; then
            brew install swiftlint
          fi
          swiftlint version

      - name: Run SwiftLint
        # Not --strict yet; warnings are surfaced but don't fail the build.
        # Once the codebase is clean we'll switch to --strict.
        run: swiftlint --reporter github-actions-logging

  format-check:
    name: Format Check
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftFormat
        run: |
          if ! command -v swiftformat >/dev/null; then
            brew install swiftformat
          fi
          swiftformat --version

      - name: Verify formatting
        # Lint-only mode: never modifies files, exits non-zero on diff.
        run: swiftformat --lint .
        continue-on-error: true
